.rocket-btn{position:absolute;width:110px;height:110px;border-radius:9999px;background:radial-gradient(circle at 35% 30%,#ffcc5a,#ff7a2a 55%,#d94f14);border:4px solid #fff1c9;box-shadow:0 6px 18px rgba(0,0,0,0.4),inset 0 -4px 0 rgba(0,0,0,0.18);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;z-index:20;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform 0.06s ease-out;}
.rocket-btn:active{transform:scale(0.92);}
.rocket-emoji{font-size:38px;line-height:1.1;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3));}
.rocket-label{color:#fff;font-weight:900;font-size:13px;letter-spacing:1.2px;text-shadow:0 2px 4px rgba(0,0,0,0.45);margin-top:1px;}
.cooldown-ring{position:absolute;inset:-4px;border-radius:9999px;pointer-events:none;}
.card-pop{animation:card-pop 0.35s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes card-pop{from{transform:scale(0.85) translateY(16px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.wiggle{display:inline-block;animation:wiggle 1.6s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
.big-btn{transition:transform 0.08s ease-out;}
.big-btn:active{transform:scale(0.95);}
@keyframes feed-in{from{transform:translateX(14px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes train-shake{0%,100%{transform:translateX(0);}10%{transform:translateX(-3px) rotate(-0.6deg);}20%{transform:translateX(3px) rotate(0.6deg);}30%{transform:translateX(-2px);}50%{transform:translateX(2px);}70%{transform:translateX(-1px);} }
.train-banner{animation:train-shake 0.22s linear infinite, banner-pop 0.34s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes banner-pop{from{transform:translate(-50%,-20px) scale(0.8);opacity:0;}to{transform:translate(-50%,0) scale(1);opacity:1;}}
.lb-card{border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 24px rgba(0,0,0,0.28);}
.lb-toggle{width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.14);color:#fff;font-weight:900;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background 0.18s ease, transform 0.12s ease;}
.lb-toggle:active{transform:scale(0.92);background:rgba(255,255,255,0.18);}
.lb-toggle:hover{background:rgba(255,255,255,0.16);}
.lb-wrap{display:grid;transition:grid-template-rows 0.36s cubic-bezier(0.34,1.3,0.64,1), opacity 0.28s ease;}
.lb-wrap.expanded{grid-template-rows:1fr;opacity:1;}
.lb-wrap.collapsed{grid-template-rows:0fr;opacity:0;}
.lb-wrap > div{overflow:hidden;}
.lb-arrow{display:inline-block;transition:transform 0.32s cubic-bezier(0.34,1.3,0.64,1);}
.lb-arrow.collapsed{transform:rotate(-90deg);}
.lb-arrow.expanded{transform:rotate(0deg);}
.lb-mini-pill{animation:lb-pill-in 0.3s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes lb-pill-in{from{transform:scale(0.7) translateY(-4px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.giant-banner{animation:train-shake 0.16s linear infinite, banner-pop 0.3s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes von-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.piano-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:26;display:flex;gap:3px;padding:6px 8px;border-radius:14px;background:rgba(0,0,0,0.62);border:1.5px solid rgba(255,255,255,0.18);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,0.45);pointer-events:none;transition:opacity 0.2s ease, transform 0.2s ease;}
.piano-key{width:38px;height:64px;border-radius:8px;background:linear-gradient(to bottom,#fff,#e6e6e6);border:1px solid rgba(0,0,0,0.25);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;position:relative;overflow:hidden;transition:all 0.12s ease;box-shadow:inset 0 -3px 0 rgba(0,0,0,0.18), 0 2px 4px rgba(0,0,0,0.2);}
.piano-key.active{background:linear-gradient(to bottom,#ffea7a,#ffd23f 55%,#ffb700);border-color:#b88600;box-shadow:0 0 14px rgba(255,210,63,0.9), inset 0 -3px 0 rgba(0,0,0,0.15);transform:translateY(2px) scale(0.98);}
.piano-key.active::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(to bottom,rgba(255,255,255,0.7),transparent);pointer-events:none;}
.piano-label{font-size:10px;font-weight:900;letter-spacing:0.6px;color:#000;opacity:0.7;}
.piano-key.active .piano-label{color:#000;opacity:1;}
.piano-note-dot{width:8px;height:8px;border-radius:9999px;background:#000;opacity:0.18;margin-bottom:4px;transition:all 0.12s ease;}
.piano-key.active .piano-note-dot{background:#000;opacity:0.9;box-shadow:0 0 6px rgba(0,0,0,0.5);}
.piano-title{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;letter-spacing:1.2px;color:#ffd23f;text-shadow:0 1px 3px rgba(0,0,0,0.8);white-space:nowrap;}
